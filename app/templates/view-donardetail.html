{% extends 'base-admin.html' %}
{% load static %}
{% block main %}
<div class="container mt-5 vh-100 table-responsive">
  <h3>View Donar Detail</h3>
  <hr>
  <table id="mytable" class="table data ">
      <tbody>
          <tr class="align-middle text-center" >
              <th colspan="4"><h3>Donar Details</h3></th>
          </tr>
          <tr class="align-middle text-center">
            <td><h5>Donar Name</h5></td>
            <td><h5 class="text-secondary">{{donar.user.first_name}} {{donar.user.last_name}}</h5></td>
            <td><h5>Donar Contact</h5></td>
            <td><h5 class="text-secondary">{{donar.contact}}</h5></td>
        </tr>
          <tr class="align-middle text-center">
              <td><h5>Email</h5></td>
              <td><h5 class="text-secondary">{{donar.user.email}}</h5></td>
              <td><h5>Donar Pic</h5></td>
            <td><img src="{{donar.userpic.url}}" width="80" height="80" /></td>
          </tr>
        
        <tr align="center">
          <td colspan="4" style="font-size:20px;color:red">
              <a href="{% url 'delete_donar' donar.user.id %}" onclick="return confirm('Are You Sure?')" class="text-primary">Delete</a>
          </td>
        </tr>

      </tbody>
  </table>
</div>
{% endblock main %}
